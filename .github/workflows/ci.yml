name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev --no-install-package gdal
          uv pip install "GDAL==$(gdal-config --version)"

      - name: Run unit tests
        run: SKIP_NETWORK_TESTS=1 uv run pytest tests/ -v

  e2e:
    name: E2E tests (Monaco / Niue)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install system GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --extra dev --no-install-package gdal
          uv pip install "GDAL==$(gdal-config --version)"

      - name: Run E2E tests
        run: uv run pytest tests/test_e2e_osm_pbf.py -v
