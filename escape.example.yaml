# escape.yaml — CNG Data Antigravity configuration
#
# Built-in sources (no sources: section needed):
#   overture        — Overture Maps, all themes → output/overture/{type}.parquet
#   osm-jp-pmtiles  — OpenStreetMap Japan PMTiles → output/osm-jp-pmtiles/osm-jp-pmtiles.pmtiles
#   sentinel-2-pc   — Sentinel-2 L2A via Planetary Computer → output/sentinel-2-pc/sentinel-2-pc.tif
#
# Per-extract overrides (e.g. datetime, maxCloudCover) are written directly under the extract.
# id is optional; defaults to the source name.
# outputs is optional; defaults to output/{id}/{id}.{ext} (or output/{id}/{type}.parquet for overture).

aoi:
  bbox: [139.56, 35.52, 139.92, 35.82]  # [west, south, east, north]

extracts:
  - source: overture

  - source: osm-jp-pmtiles

  - source: sentinel-2-pc
    datetime: "2025-09-01/2025-11-30"
    maxCloudCover: 20

  # Geofabrik requires a region, so define it in sources:
  # sources:
  #   osm-kanto:
  #     adapter: geofabrik
  #     region: kanto
  # extracts:
  #   - source: osm-kanto

  # Same source, different time range → use explicit id to avoid collision
  # - id: sentinel-2-winter
  #   source: sentinel-2-pc
  #   datetime: "2026-01-01/2026-03-31"
  #   maxCloudCover: 30
